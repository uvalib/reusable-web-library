name: Feature or change request
description: Ask for a new option, behaviour or change in an existing component
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: >
        This repository is public. Don't include passwords, tokens, internal-only hostnames, patron or
        staff personal data, or screenshots that show any of these.
  - type: input
    id: component
    attributes:
      label: Component
      description: The tag (for example `<site-header>`), stylesheet (`base.css`) or the skill.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From the CDN manifest (`/web-components/v1/manifest.json`), package.json, or the skill's installed.json.
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: The option or behaviour you need, and an example of the markup or API you'd expect.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The site and page (public URL) and what people can't do today.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround in use
      description: What the site does today, if anything.

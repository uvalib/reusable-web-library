# Lint and test pull requests to main, and run Lighthouse CI on pull requests, pushes to main
# and on demand. Unprivileged: read-only token, no secrets, publishes nothing. Pushes to main
# are linted and tested by pages.yml; releases run in AWS CodePipeline.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pushes to main already run lint and the tests in pages.yml.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm test

  # Lighthouse CI over one standalone page per playground example (scripts/lhci.mjs):
  # accessibility 1.0, best practices >= 0.95, performance >= 0.9, CLS <= 0.05 and
  # TBT <= 200 ms, as medians of three runs (lighthouserc.json; about 10 minutes). Third
  # parties are blocked or stubbed locally.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor, so a
      # Chrome started by Lighthouse (not Playwright) aborts with "No usable sandbox".
      # Re-allow them on this throwaway runner rather than run Chrome with --no-sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm lhci

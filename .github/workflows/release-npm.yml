# Publishes @uvalib/web-components to npm when a v* tag is pushed, using npm Trusted Publishing
# (OIDC): no npm token is stored anywhere. The CDN half of the release runs separately in the
# terraform-infrastructure CodePipeline on the same tag. Re-run this one with "Re-run jobs" on the
# tag's run (GitHub keeps runs for 30 days; after that, push a new patch tag). A version that is
# already on npm is skipped.
#
# Security: npm's trusted publisher checks the repo, this workflow's filename and the `npm`
# environment, but not the ref. The environment's deployment rule (tag `v*` only), required
# reviewers and the `v*` tag ruleset are therefore the real controls; see README "Releasing".
# `verify` runs the repo's scripts with no publish identity. Only `publish` can mint the OIDC
# token, and it runs nothing but the install without scripts, the build and `npm publish`.
name: Release npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Bad release tag: $TAG" >&2; exit 1; }
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main' "+refs/tags/$TAG:refs/tags/$TAG"
          TAG_COMMIT="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)"
          if [ -z "$TAG_COMMIT" ] || [ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]; then
            echo "Tag $TAG (commit ${TAG_COMMIT:-unknown}) is not the checked-out commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tag $TAG (commit $TAG_COMMIT) is not on main; refusing to publish" >&2
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "Tag $TAG does not match package.json version v$PKG_VERSION" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      # No package-manager cache in either job: a poisoned cache must not reach a release build.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Dependency install scripts are not run; playwright's browser is installed explicitly.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      NPM_VERSION: 12.2.2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag again
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Bad release tag: $TAG" >&2; exit 1; }
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main' "+refs/tags/$TAG:refs/tags/$TAG"
          TAG_COMMIT="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)"
          if [ -z "$TAG_COMMIT" ] || [ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]; then
            echo "Tag $TAG (commit ${TAG_COMMIT:-unknown}) is not the checked-out commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tag $TAG (commit $TAG_COMMIT) is not on main; refusing to publish" >&2
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "Tag $TAG does not match package.json version v$PKG_VERSION" >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the Node version (the pinned npm requires Node ^24.15.0)
        run: |
          set -eu
          node -e "const [a,b]=process.versions.node.split('.').map(Number); process.exit(a>24||(a===24&&b>=15)?0:1)" || { echo "Node $(node --version) is too old for npm $NPM_VERSION; need v24.15.0 or later" >&2; exit 1; }
      - name: Install the pinned npm (trusted publishing needs 11.5.1 or later)
        run: |
          set -eu
          npm install -g "npm@$NPM_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          echo "npm $NPM_VERSION"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # package.json has no prepack, so build explicitly.
      - run: pnpm build
      - name: Publish to npm
        run: |
          set -eu
          # stdout and stderr are kept apart: an npm warning on stderr must not change the version comparison.
          ERR_FILE="$(mktemp)"
          trap 'rm -f "$ERR_FILE"' EXIT
          # Inside an if condition, set -e does not stop on a non-zero exit.
          if OUT="$(npm view "@uvalib/web-components@$VERSION" version 2>"$ERR_FILE")"; then
            if [ "$OUT" = "$VERSION" ]; then
              echo "@uvalib/web-components@$VERSION is already on npm; skipping publish"
              exit 0
            fi
            echo "Unexpected npm view output: $OUT" >&2
            cat "$ERR_FILE" >&2
            exit 1
          fi
          # Missing version or missing package: npm exits 1 with E404 on stderr. Anything else is a failure.
          if ! grep -q 'E404' "$ERR_FILE"; then
            echo "npm view failed:" >&2
            cat "$ERR_FILE" >&2
            exit 1
          fi
          npm publish --access public --ignore-scripts

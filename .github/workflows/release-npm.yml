# Publishes @uvalib/web-components to npm when a v* tag is pushed, using npm Trusted Publishing
# (OIDC): no npm token is stored anywhere. The CDN half of the release runs separately in the
# terraform-infrastructure CodePipeline on the same tag. Re-run either one independently
# (this one via workflow_dispatch with the tag; it skips versions that are already on npm).
# The trusted publisher on npmjs.com must name this exact file (release-npm.yml) and the
# `npm` environment.
name: Release npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and verify the release tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -eu
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Bad release tag: $TAG" >&2; exit 1; }
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main' "+refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "refs/tags/$TAG"
          TAG_COMMIT="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)"
          if [ -z "$TAG_COMMIT" ] || [ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]; then
            echo "Tag $TAG (commit ${TAG_COMMIT:-unknown}) is not the checked-out commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tag $TAG (commit $TAG_COMMIT) is not on main; refusing to publish" >&2
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "Tag $TAG does not match package.json version v$PKG_VERSION" >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      # No package-manager cache: this job holds an OIDC publish identity, and npm's example
      # disables caching for release builds so a poisoned cache cannot reach the publish.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use a trusted-publishing capable npm
        run: |
          set -eu
          npm install -g npm@latest
          V="$(npm --version)"
          echo "npm $V"
          [ "$(printf '%s\n' 11.5.1 "$V" | sort -V | head -n1)" = "11.5.1" ] || { echo "npm $V is older than 11.5.1" >&2; exit 1; }
      # Dependency install scripts are not run: this job can publish. playwright's browser is installed explicitly.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm test
      - name: Publish to npm
        run: |
          set -eu
          if [ "$(npm view "@uvalib/web-components@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "@uvalib/web-components@$VERSION is already on npm; skipping publish"
          else
            npm publish --access public
          fi

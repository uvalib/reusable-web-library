# Builds and deploys the playground site (site/) to GitHub Pages:
# https://uvalib.github.io/reusable-web-library/ (spec §9a). Releases stay on CodeBuild.
# One-time repo setting: Settings > Pages > Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds dist/ and dist-cdn/, plus dist-site/ with the test base (/dist-site/).
      - run: pnpm test
      # Rebuild only the site, with the production base (/reusable-web-library/).
      - run: pnpm build:site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

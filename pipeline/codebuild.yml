AWSTemplateFormatVersion: '2010-09-09'
Description: CodeBuild project that tests @uvalib/web-components and, on v* tags, publishes to npm and the CDN.

Parameters:
  GitHubRepoUrl:
    Type: String
    Default: https://github.com/uvalib/reusable-web-library
  BucketName:
    Type: String
    Default: unpkg.internal.lib.virginia.edu
  DistributionId:
    Type: String
    Description: CloudFront distribution ID that fronts the bucket.

Resources:
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: web-components-release
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListVersionPrefixes
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${BucketName}
                Condition:
                  StringLike:
                    's3:prefix': ['web-components/v*']
              - Sid: WriteVersionPrefixes
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::${BucketName}/web-components/v*
              - Sid: InvalidateMajorAlias
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}
              - Sid: ReadNpmToken
                Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/web-components/npm-token
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: web-components
      Description: Test every push and PR to main; publish on v* tags.
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: BUCKET, Type: PLAINTEXT, Value: !Ref BucketName }
          - { Name: DISTRIBUTION_ID, Type: PLAINTEXT, Value: !Ref DistributionId }
      Source:
        Type: GITHUB
        Location: !Ref GitHubRepoUrl
        BuildSpec: pipeline/buildspec.yml
      Triggers:
        Webhook: true
        FilterGroups:
          - - { Type: EVENT, Pattern: PUSH }
            - { Type: HEAD_REF, Pattern: '^refs/tags/v.*' }
          - - { Type: EVENT, Pattern: PUSH }
            - { Type: HEAD_REF, Pattern: '^refs/heads/main$' }
          - - { Type: EVENT, Pattern: 'PULL_REQUEST_CREATED,PULL_REQUEST_UPDATED' }
            - { Type: BASE_REF, Pattern: '^refs/heads/main$' }

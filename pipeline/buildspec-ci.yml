version: 0.2

# Push/PR to main: lint and test (pnpm test builds first). Nothing is published; no secrets.
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm i -g n@11.0.0 && n 24 && hash -r
      - test "$(node -p "process.versions.node.split(\".\")[0]")" = "24"
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm exec playwright install --with-deps chromium
  build:
    commands:
      - pnpm lint && pnpm test

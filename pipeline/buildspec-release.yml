version: 0.2

# Tag v*: lint, test (builds), then publish to npm and the CDN. The npm token is read from
# SSM only inside the publish step and is never echoed.
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm i -g n@11.0.0 && n 24 && hash -r
      - test "$(node -p "process.versions.node.split(\".\")[0]")" = "24"
      - corepack enable
      # Dependency install scripts are not run in the release build (it holds publish credentials).
      # Nothing here needs them: playwright's browser is installed explicitly below.
      - pnpm install --frozen-lockfile --ignore-scripts
      - pnpm exec playwright install --with-deps chromium
  build:
    commands:
      - pnpm lint && pnpm test
  post_build:
    commands:
      - |
        set -eu
        if [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then echo "Build failed; not publishing"; exit 0; fi
        TAG=""
        case "${CODEBUILD_WEBHOOK_TRIGGER:-}" in
          tag/v*) TAG="${CODEBUILD_WEBHOOK_TRIGGER#tag/}" ;;
        esac
        if [ -z "$TAG" ]; then
          # Manual StartBuild or retry: the source version is the tag ref.
          case "${CODEBUILD_SOURCE_VERSION:-}" in
            refs/tags/v*) TAG="${CODEBUILD_SOURCE_VERSION#refs/tags/}" ;;
          esac
        fi
        if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "No release tag found (trigger='${CODEBUILD_WEBHOOK_TRIGGER:-}', source='${CODEBUILD_SOURCE_VERSION:-}')" >&2
          exit 1
        fi
        # Only publish tags whose commit is on main.
        git fetch --unshallow >/dev/null 2>&1 || true
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        TAG_COMMIT="$(git rev-parse "refs/tags/$TAG^{commit}" 2>/dev/null || echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}")"
        if [ -z "$TAG_COMMIT" ] || ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
          echo "Tag $TAG (commit ${TAG_COMMIT:-unknown}) is not on main; refusing to publish" >&2
          exit 1
        fi
        VERSION="${TAG#v}"
        PKG_VERSION="$(node -p "require('./package.json').version")"
        if [ "$TAG" != "v$PKG_VERSION" ]; then
          echo "Tag $TAG does not match package.json version v$PKG_VERSION" >&2
          exit 1
        fi
        if [ "$(npm view "@uvalib/web-components@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
          echo "@uvalib/web-components@$VERSION is already on npm; skipping publish"
        else
          NPM_TOKEN="$(aws ssm get-parameter --name /web-components/npm-token --with-decryption --query Parameter.Value --output text)"
          export NPM_TOKEN
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > .npmrc
          npm publish --access public
          rm -f .npmrc
          unset NPM_TOKEN
        fi
        bash pipeline/publish-cdn.sh "$VERSION"

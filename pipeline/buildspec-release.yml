version: 0.2

# Tag v*: lint, test (builds), then publish to npm and the CDN. The npm token is read from
# SSM only inside the publish step and is never echoed. Any code running in this build could
# read it too (the role must allow it), hence --ignore-scripts and a granular publish-only token.
# Runs from the terraform-infrastructure CodePipeline (aws_cicd/pipelines/reusable-web-library),
# which starts on v* tag pushes and hands CodeBuild a full clone checked out at the tagged commit.
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm i -g n@11.0.0 && n 24 && hash -r
      - test "$(node -p "process.versions.node.split(\".\")[0]")" = "24"
      - corepack enable
      # Dependency install scripts are not run in the release build (it holds publish credentials).
      # Nothing here needs them: playwright's browser is installed explicitly below.
      - pnpm install --frozen-lockfile --ignore-scripts
      - pnpm exec playwright install --with-deps chromium
  build:
    commands:
      # The pipeline sets inject_repo_tokens = false; fail closed if repo tokens ever reappear.
      - '[ -z "${GITHUB_TOKEN+x}${GITLAB_TOKEN+x}" ] || { echo "repo tokens present" >&2; exit 1; }'
      - pnpm lint && pnpm test
  post_build:
    commands:
      # The pipeline sets inject_repo_tokens = false; fail closed if repo tokens ever reappear.
      - '[ -z "${GITHUB_TOKEN+x}${GITLAB_TOKEN+x}" ] || { echo "repo tokens present" >&2; exit 1; }'
      - |
        set -eu
        if [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then echo "Build failed; not publishing"; exit 0; fi
        # The repo is public: fetch main and the release tags anonymously rather than enabling the
        # git credential helper (which would expose the connection's token to the build).
        REPO_URL="https://github.com/uvalib/reusable-web-library.git"
        git fetch --unshallow >/dev/null 2>&1 || true
        git fetch --no-tags --force "$REPO_URL" \
          '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/v*:refs/tags/v*'
        TAG=""
        case "${CODEBUILD_WEBHOOK_TRIGGER:-}" in
          tag/v*) TAG="${CODEBUILD_WEBHOOK_TRIGGER#tag/}" ;;
        esac
        if [ -z "$TAG" ]; then
          # CodePipeline: no webhook variables; the release tag is the one on the checked-out commit.
          TAGS="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          if [ "$(printf '%s\n' "$TAGS" | grep -c .)" != "1" ]; then
            echo "Expected exactly one vX.Y.Z tag on $(git rev-parse HEAD), found: ${TAGS:-none}" >&2
            exit 1
          fi
          TAG="$TAGS"
        fi
        if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "No release tag found (trigger='${CODEBUILD_WEBHOOK_TRIGGER:-}', tag='$TAG')" >&2
          exit 1
        fi
        # Only publish tags whose commit is the one built here and is on main.
        TAG_COMMIT="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)"
        if [ -z "$TAG_COMMIT" ] || [ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]; then
          echo "Tag $TAG (commit ${TAG_COMMIT:-unknown}) is not the checked-out commit; refusing to publish" >&2
          exit 1
        fi
        if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
          echo "Tag $TAG (commit $TAG_COMMIT) is not on main; refusing to publish" >&2
          exit 1
        fi
        VERSION="${TAG#v}"
        PKG_VERSION="$(node -p "require('./package.json').version")"
        if [ "$TAG" != "v$PKG_VERSION" ]; then
          echo "Tag $TAG does not match package.json version v$PKG_VERSION" >&2
          exit 1
        fi
        if [ "$(npm view "@uvalib/web-components@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
          echo "@uvalib/web-components@$VERSION is already on npm; skipping publish"
        else
          NPM_TOKEN="$(aws ssm get-parameter --name /web-components/npm-token --with-decryption --query Parameter.Value --output text)"
          export NPM_TOKEN
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > .npmrc
          npm publish --access public
          rm -f .npmrc
          unset NPM_TOKEN
        fi
        bash pipeline/publish-cdn.sh "$VERSION"

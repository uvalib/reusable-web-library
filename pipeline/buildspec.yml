version: 0.2

# Push/PR to main: lint, test, build. Tag v*: additionally publish to npm and the CDN.
# Required project env: BUCKET, DISTRIBUTION_ID (set by pipeline/codebuild.yml).
env:
  variables:
    PREFIX: web-components
  parameter-store:
    NPM_TOKEN: /web-components/npm-token

phases:
  install:
    runtime-versions:
      # standard:7.0 offers nodejs 18/20/22 only; "latest" resolves to the newest
      # installed (>=22 required by package.json engines, asserted below).
      nodejs: latest
    commands:
      - node -e "if (+process.versions.node.split('.')[0] < 22) { console.error('Node >=22 required, got ' + process.version); process.exit(1) }"
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm exec playwright install --with-deps chromium
  build:
    commands:
      - pnpm lint && pnpm test && pnpm build
  post_build:
    commands:
      - |
        set -e
        if [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then echo "Build failed; not publishing"; exit 0; fi
        case "${CODEBUILD_WEBHOOK_TRIGGER:-}" in
          tag/v*) ;;
          *) echo "Trigger '${CODEBUILD_WEBHOOK_TRIGGER:-none}' is not a release tag; nothing to publish"; exit 0 ;;
        esac
        TAG="${CODEBUILD_WEBHOOK_TRIGGER#tag/}"
        VERSION="${TAG#v}"
        PKG_VERSION="$(node -p "require('./package.json').version")"
        if [ "$TAG" != "v$PKG_VERSION" ]; then
          echo "Tag $TAG does not match package.json version v$PKG_VERSION" >&2
          exit 1
        fi
        printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > .npmrc
        if [ "$(npm view "@uvalib/web-components@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
          echo "@uvalib/web-components@$VERSION is already on npm; skipping publish"
        else
          npm publish --access public
        fi
        rm -f .npmrc
        bash pipeline/publish-cdn.sh "$VERSION"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground · UVA Library web components</title>
    <meta
      name="description"
      content="Edit a UVA Library page built with the web components, and share it as a link."
    />
    <link rel="stylesheet" href="./src/site.css" />
    <!-- The site's own copy of the CDN build (dist-site/cdn/; in dev, the component source). -->
    <script type="module" src="./cdn/site-page.js" vite-ignore></script>
    <script type="module" src="./src/playground.ts"></script>
  </head>
  <body class="full">
    <site-page site-links-label="Playground">
      <a slot="site-links" href="./">Gallery</a>
      <a slot="site-links" href="playground.html" aria-current="page">Playground</a>
      <a slot="site-links" href="https://github.com/uvalib/reusable-web-library#readme">README</a>
      <h1>Playground</h1>
      <div class="toolbar">
        <label for="preset">Preset</label>
        <select id="preset"></select>
        <button type="button" id="reset">Reset</button>
        <span class="copy">
          <button type="button" id="copy-link">Copy link</button>
          <span class="status" role="status"></span>
        </span>
      </div>
      <p id="preset-description" class="description"></p>
      <playground-ide resizable line-numbers editable-file-system></playground-ide>
    </site-page>
  </body>
</html>
